<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  <rect x="40" y="40" width="432" height="432" rx="80" fill="#1e293b"/>
  <!-- Activity line chart -->
  <polyline points="80,340 160,260 240,300 320,180 400,220 432,160"
    fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
